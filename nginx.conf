server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control "no-store" always;
  location / { try_files $uri $uri/ =404; }
  location /pliki/ { add_header X-Robots-Tag "noindex, nofollow" always; add_header Cache-Control "no-store" always; add_header Content-Disposition "attachment"; }
}
